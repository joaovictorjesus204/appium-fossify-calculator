name: Testes mobile (Appium)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Dias úteis, 9h de Brasília
    - cron: '0 12 * * 1-5'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Habilitar aceleração do emulador (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instalar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Instalar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Instalar Appium e o driver UiAutomator2
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Instalar dependências Python e baixar o app
        run: |
          pip install -r requirements.txt
          python -c "from conftest import baixar_apk; baixar_apk()"

      - name: Rodar os testes no emulador Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/rodar-ci.sh

      - name: Página dos relatórios
        if: always()
        run: cp reports/report.html reports/index.html || true

      - name: Guardar relatório, vídeos e log do Appium
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-appium
          path: reports

      - name: Preparar publicação
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: reports

  deploy-report:
    needs: test
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
